name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The hacs/action job (category: integration, no ignores) is added in phase 3,
# once the repo is public and has brand icons, a description and topics.
# The panel job (build + committed bundle check) is added in phase 2.

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy custom_components/energy_flow_mapper
