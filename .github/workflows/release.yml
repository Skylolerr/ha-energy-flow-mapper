name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Check version and ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match manifest version (vX.Y.Z)
        run: |
          version="$(jq -r .version custom_components/energy_flow_mapper/manifest.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version v${version}"
            exit 1
          fi
      - name: CHANGELOG must have a section for the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section '## [${version}]'"
            exit 1
          fi
      - name: Build ZIP
        run: |
          cd custom_components/energy_flow_mapper
          zip -r "${GITHUB_WORKSPACE}/energy_flow_mapper.zip" . -x '__pycache__/*'
      # scripts/release.sh attaches the ZIP when it creates the release; HACS
      # installs it (zip_release), so an existing one is never replaced.
      - name: Attach ZIP if the release has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' | grep -qx energy_flow_mapper.zip; then
            echo "The release has its ZIP already."
          else
            gh release upload "${GITHUB_REF_NAME}" energy_flow_mapper.zip
          fi
